name: Hyperdrop Cognitive Training

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Fine-tunable OpenAI base model"
        required: false
        default: "gpt-4.1-mini-2025-04-14"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q core/cognition
      - name: Validate seed cognitive dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/cognitive_sft.jsonl")
          rows=[json.loads(x) for x in p.read_text(encoding="utf-8").splitlines() if x.strip()]
          assert rows, "training dataset is empty"
          assert all("instruction" in x and "target" in x and "metadata" in x for x in rows)
          print("seed examples:",len(rows))
          PY
      - name: Build OpenAI training JSONL
        run: |
          python - <<'PY'
          from core.cognition.openai_export import convert
          convert("artifacts/cognitive_sft.jsonl", "artifacts/openai_train.jsonl")
          PY
      - name: Start OpenAI fine-tune
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m core.cognition.openai_finetune artifacts/openai_train.jsonl --model "${{ inputs.model }}" --output artifacts/fine_tune_result.json
      - name: Upload training result
        uses: actions/upload-artifact@v4
        with:
          name: hyperdrop-cognitive-training-result
          path: artifacts/fine_tune_result.json
