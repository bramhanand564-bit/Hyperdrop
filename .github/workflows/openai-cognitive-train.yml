name: Hyperdrop Cognitive Training

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Fine-tunable OpenAI base model"
        required: false
        default: "gpt-4.1-mini-2025-04-14"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q core/cognition
      - name: Build OpenAI training JSONL
        run: |
          python - <<'PY'
          from core.cognition.openai_export import convert
          convert("artifacts/cognitive_sft.jsonl", "artifacts/openai_train.jsonl")
          PY
      - name: Start OpenAI fine-tune
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m core.cognition.openai_finetune artifacts/openai_train.jsonl --model "${{ inputs.model }}"
