name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase service-account credentials
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules with Application Default Credentials
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: firebase deploy --only firestore:rules --project naxchat-27309

      - name: Deploy Firestore rules with legacy token
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON == '' && secrets.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules --project naxchat-27309 --token "$FIREBASE_TOKEN"

      - name: Explain missing Firebase CI credentials
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON == '' && secrets.FIREBASE_TOKEN == '' }}
        run: |
          echo "Firebase rules were not deployed because no CI credential is configured."
          echo "Add FIREBASE_SERVICE_ACCOUNT_JSON (recommended) or FIREBASE_TOKEN in GitHub Actions secrets."
          exit 1
