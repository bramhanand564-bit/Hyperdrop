name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
            firebase deploy --only firestore:rules --project naxchat-27309
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            firebase deploy --only firestore:rules --project naxchat-27309 --token "$FIREBASE_TOKEN"
          else
            echo "::error::Firebase CI credentials are missing."
            echo "Configure FIREBASE_SERVICE_ACCOUNT_JSON (recommended) or FIREBASE_TOKEN in GitHub Actions secrets."
            exit 1
          fi
