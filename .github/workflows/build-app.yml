name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build

      - name: Setup Capacitor Android
        run: |
          cd frontend
          npx cap init HyperDrop com.hyperdrop.app --web-dir out || true
          npx cap add android || true
          npx cap sync android

      - name: Fix Gradle Bug & Build APK
        run: |
          cd frontend/android
          
          # 1. Sabse pehle kharab cache ko jad se mitao bina Gradle ko touch kiye
          rm -rf ~/.gradle/caches/
          rm -rf .gradle
          
          # 2. Text replace karke Gradle ko direct 8.7 version par daalo (Bypass server bug)
          sed -i 's/distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          
          # 3. Safe settings inject karo
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          chmod +x gradlew
          
          # 4. Final Build
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
