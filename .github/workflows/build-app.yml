name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Java (For Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web App
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build

      - name: Setup Android Project
        run: |
          cd frontend
          npx cap init HyperDrop com.hyperdrop.app --web-dir out || true
          npx cap add android || true
          npx cap sync android

      - name: Clean Cache & Upgrade Gradle Wrapper
        run: |
          cd frontend/android
          
          # 1. Stop any background daemons that might lock files
          ./gradlew --stop || true
          
          # 2. Force remove the problematic Gradle caches to prevent corrupted state
          rm -rf ~/.gradle/caches/jars-9/
          rm -rf ~/.gradle/caches/transforms-3/
          
          # 3. Upgrade Gradle to 8.7 to bypass the 8.2.1 BCProv instrumentation bug
          ./gradlew wrapper --gradle-version 8.7

      - name: Build APK
        run: |
          cd frontend/android
          
          # 4. Build safely with the upgraded wrapper
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
