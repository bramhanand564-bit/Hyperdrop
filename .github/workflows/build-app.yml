name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Java (For Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Build Web App
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build

      - name: Setup Android Project
        run: |
          cd frontend
          npx cap init HyperDrop com.hyperdrop.app --web-dir out || true
          npx cap add android || true
          npx cap sync android

      - name: Direct Wrapper Upgrade & Cache Purge
        run: |
          cd frontend/android
          
          # 1. Force delete the corrupted jars-9 cache before touching Gradle
          rm -rf ~/.gradle/caches/jars-9/
          rm -rf ~/.gradle/caches/transforms-3/
          
          # 2. Delete local build remnants
          rm -rf .gradle
          rm -rf build
          rm -rf app/build
          
          # 3. DIRECTLY edit the wrapper file to use Gradle 8.7 (bypasses the 8.2.1 bug)
          sed -i 's/^distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          
          # 4. Inject safe properties to prevent further locking
          echo "" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          chmod +x gradlew

      - name: Verify New Gradle Version
        run: |
          cd frontend/android
          # This invokes the newly downloaded 8.7 wrapper directly
          ./gradlew --version

      - name: Build APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --no-parallel --stacktrace

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
