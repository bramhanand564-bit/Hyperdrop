name: Build Android App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build Web App
        working-directory: frontend
        run: |
          npm install
          npm install --no-save @capacitor/core@6.1.2 @capacitor/android@6.1.2 @capacitor/cli@6.1.2
          npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android Project
        working-directory: frontend
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --no-parallel

      - name: Package APK as ZIP
        run: |
          mkdir -p release
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk release/HyperDrop-debug.apk
          cd release
          zip HyperDrop-Android.zip HyperDrop-debug.apk

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-Android
          path: |
            release/HyperDrop-debug.apk
            release/HyperDrop-Android.zip
          if-no-files-found: error
