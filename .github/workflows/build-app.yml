name: Build Android App

on:
  workflow_dispatch: # YEH SABSE ZAROORI HAI: Isse app khud build nahi hoga, jab aap start karenge tabhi hoga.

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Purani warning hatane ke liye version 20

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Zulu ki jagah Temurin use karenge jo jyada stable hai
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build

      - name: Setup Capacitor Android
        run: |
          cd frontend
          npx cap init HyperDrop com.hyperdrop.app --web-dir out || true
          npx cap add android || true
          npx cap sync android

      - name: Fix Gradle Bug & Build APK
        run: |
          cd frontend/android
          
          # 1. Cloud server ki kharab cache (bcprov bug) ko jad se mitao
          rm -rf ~/.gradle/caches/
          rm -rf .gradle
          
          # 2. Gradle ko zabardasti naye version (8.7) par shift karo jisme ye bug nahi hai
          sed -i 's/distributionUrl=.*/distributionUrl=https\:\/\/services.gradle.org\/distributions\/gradle-8.7-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          
          # 3. Permissions do aur safe mode mein app build karo
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
