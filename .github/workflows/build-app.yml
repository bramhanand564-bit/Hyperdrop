name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Yeh official tool jar-locking aur cache corruption ko jad se rokta hai
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Web App
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build

      - name: Setup Android Project
        run: |
          cd frontend
          npx cap init HyperDrop com.hyperdrop.app --web-dir out
          npx cap add android
          npx cap sync android

      - name: Build APK (Ultra Safe Mode)
        run: |
          cd frontend/android
          
          # Android system ke andar zabardasti safe settings inject kar rahe hain
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.caching=false" >> gradle.properties
          
          chmod +x gradlew
          
          # Clean build without any background conflicts
          ./gradlew clean assembleDebug

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
