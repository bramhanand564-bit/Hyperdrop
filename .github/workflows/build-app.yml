name: Build Android App

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Yahan cache hata diya hai, kyunki wahi sabse pehle error laa raha tha

      - name: Build Web App
        run: |
          cd frontend
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build

      - name: Generate Android Project
        run: |
          cd frontend
          npx cap init HyperDrop com.hyperdrop.app --web-dir out || true
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd frontend/android
          chmod +x gradlew
          # Sirf basic commands: no-daemon (memory bachane ke liye) aur no-parallel (file lock rokne ke liye)
          ./gradlew assembleDebug --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperDrop-App
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
