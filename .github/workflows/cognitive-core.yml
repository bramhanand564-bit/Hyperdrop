name: Hyperdrop Cognitive Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cognition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q core/cognition
