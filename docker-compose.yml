services:
  signaling:
    build: ./apps/signaling
    environment:
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      - "8080:8080"

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_SIGNAL_URL: ws://localhost:8080
      NEXT_PUBLIC_STUN_URL: stun:stun.l.google.com:19302
      NEXT_PUBLIC_TURN_URL: ""
      NEXT_PUBLIC_TURN_USERNAME: ""
      NEXT_PUBLIC_TURN_CREDENTIAL: ""
    ports:
      - "3000:3000"
    depends_on:
      - signaling
